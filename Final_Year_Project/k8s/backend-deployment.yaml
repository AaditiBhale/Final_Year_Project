apiVersion: apps/v1
kind: Deployment
metadata:
  name: mfg-backend
  labels:
    app: mfg-backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mfg-backend
  template:
    metadata:
      labels:
        app: mfg-backend
    spec:
      containers:
        - name: mfg-backend
          image: mfg-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: USE_MOCK_MODE
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mfg-backend-svc
spec:
  type: NodePort
  selector:
    app: mfg-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30050
